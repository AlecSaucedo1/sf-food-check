name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Shell syntax
        run: bash -n run.sh
      - name: Python compile
        run: python -m compileall -q app.py backend scripts tests
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/observations.js
          node --check static/sw.js
      - name: Test
        run: pytest -q