name: Live inspect leaderboards

on:
  push:
    branches: ["agent/inspect-live-18531"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed leaderboard API
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for deployed API version 0.6.0..."
          health=''
          for attempt in $(seq 1 30); do
            health=$(curl -fsS --max-time 20 https://sf-food-check.onrender.com/api/health || true)
            if echo "$health" | grep -q '"app_version":"0.6.0"'; then
              break
            fi
            sleep 10
          done

          echo "--- LIVE HEALTH ---"
          echo "$health" | python -m json.tool || echo "$health"
          echo "$health" | grep -q '"app_version":"0.6.0"'

          echo "--- LIVE LEADERBOARDS ---"
          curl -fsS --max-time 90 'https://sf-food-check.onrender.com/api/leaderboards?limit=10&months=18' -o /tmp/leaders.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/leaders.json'))
          m=d.get('methodology', {})
          chains=d.get('chains', [])
          neighborhoods=d.get('neighborhoods', [])
          print('methodology=', m)
          print('chains=', len(chains))
          for i,item in enumerate(chains, 1):
              print(' chain', i, item)
          print('neighborhoods=', len(neighborhoods))
          for i,item in enumerate(neighborhoods, 1):
              print(' neighborhood', i, item)
          assert m.get('direction') == 'lower_is_better'
          assert m.get('minimum_chain_locations') == 3
          assert m.get('minimum_neighborhood_restaurants') == 25
          assert len(chains) > 0
          assert len(neighborhoods) > 0
          assert all(chains[i]['average_risk'] <= chains[i+1]['average_risk'] for i in range(len(chains)-1))
          assert all(neighborhoods[i]['average_risk'] <= neighborhoods[i+1]['average_risk'] for i in range(len(neighborhoods)-1))
          PY
